<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CastleWalk Tickets · Prototipo local</title>
<style>
:root{--navy:#0c1044;--orange:#c96908;--bg:#f3f4f6;--line:#d9d9e5}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,sans-serif;background:var(--bg);color:var(--navy)}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1d70b8;outline-offset:3px}a{color:#0c1044}button{border:1px solid var(--line);border-radius:7px;padding:10px 16px;background:white;color:var(--navy)}button.primary{background:var(--orange);color:white;border-color:var(--orange);font-weight:700}button.primary:hover{background:#a05306}button:disabled{cursor:not-allowed;opacity:.55}header{background:var(--navy);color:white;padding:20px 32px;display:flex;gap:20px;align-items:center;justify-content:space-between}header a{color:white}header strong{font-size:20px;letter-spacing:.05em}.notice{background:#fff2df;border-bottom:1px solid #e8cda5;padding:10px 32px;font-size:14px;color:#4b300e}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:75vh}nav{background:var(--navy);padding:24px 18px;min-width:0}nav button{display:block;width:100%;text-align:left;margin-bottom:10px;background:transparent;color:white;border-color:#373b66}nav button.active{background:white;color:var(--navy)}main{padding:32px;max-width:1250px;width:100%;min-width:0;margin:0 auto;align-self:start}h1{font-size:30px;line-height:1.2;margin:0 0 12px}h2{font-size:21px;margin:0 0 16px}p{margin:0 0 16px}.muted{color:#54545e;font-size:14px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.spread{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px}.card b{display:block;font-size:38px;margin-top:8px}.panel{margin-bottom:20px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:20px 0}label{display:block;font-weight:700;font-size:14px}input,select,textarea{width:100%;display:block;background:white;border:1px solid #8e8e96;border-radius:6px;padding:11px;margin:6px 0 16px;color:var(--navy)}textarea{min-height:130px;resize:vertical}input[type=checkbox]{width:auto;display:inline;margin:0 6px 0 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white;font-size:15px}th,td{text-align:left;padding:16px;border-bottom:1px solid var(--line)}th{background:#ececf3;font-size:13px}.link{background:none;border:0;color:var(--navy);text-decoration:underline;padding:0;text-align:left}.pill{border-radius:20px;padding:4px 10px;font-size:13px;background:#e9ecf8;display:inline-block;white-space:nowrap}.pill.CLOSED,.pill.CANCELLED{background:#ececec;color:#444}.pill.RESOLVED{background:#e2f2e6;color:#194a29}.ticket-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}.comment{padding:14px 0;border-bottom:1px solid var(--line)}.comment small{display:block;color:#54545e}.empty{text-align:center;padding:45px 20px}.login{max-width:580px;margin:6vh auto;padding:32px}.login h1{margin-bottom:20px}.error{background:#fff1f1;border-left:4px solid #a32323;padding:14px;margin:16px 0;color:#772020}.success{background:#e4f4e7;padding:14px;border-radius:6px;margin-bottom:20px}.persona{max-width:310px}.persona select{padding:8px;margin:0;color:var(--navy)}.persona label{color:white;margin-bottom:4px}.help{font-size:14px;color:#54545e;margin-top:-8px;margin-bottom:16px}footer{padding:20px 32px;font-size:13px;color:#54545e}.inline-check{font-size:14px;font-weight:400}.timeline{padding-left:22px}.timeline li{margin-bottom:12px}.status-msg{min-height:1.5em}#toast:empty{display:none}#toast{background:#e4f4e7;padding:12px;border-bottom:1px solid #abd3b3}@media(max-width:780px){header{padding:18px;align-items:flex-start}.layout{grid-template-columns:1fr}nav{display:flex;gap:8px;padding:12px;overflow:auto}nav button{margin:0;white-space:nowrap;width:auto}main{padding:22px 16px}.cards,.ticket-grid,.filters{grid-template-columns:1fr}.cards{gap:10px}.card{padding:15px}.card b{font-size:30px}.notice{padding:10px 16px}.persona{max-width:230px}header strong{font-size:16px}.login{margin:20px auto;padding:24px 18px}}
</style></head><body>
<div class="notice"><strong>Demostrador local con datos ficticios.</strong> No conecta con el sistema ni valida su seguridad. Los cambios se borran al recargar.</div><div id="toast" role="status" aria-live="polite"></div><div id="app"></div>
<footer>CastleWalk Tickets · Referencia documental del 17 de octubre de 2026 · <a href="../index.html">Volver a los documentos</a></footer>
<script>
'use strict';
const users=[{id:'ana',name:'Ana · Administración',admin:true,members:[],leads:[]},{id:'luis',name:'Luis · Liderazgo TI',admin:false,members:[],leads:['ti']},{id:'marta',name:'Marta · Solicitante',admin:false,members:[],leads:[]},{id:'diego',name:'Diego · Atención TI',admin:false,members:['ti'],leads:[]},{id:'elena',name:'Elena · Usuario ajeno',admin:false,members:[],leads:[]}];
const areas={ti:'Tecnología de información',op:'Operaciones'};
const statuses={OPEN:'Abierto',IN_PROGRESS:'En curso',WAITING:'En espera',RESOLVED:'Resuelto',CLOSED:'Cerrado',CANCELLED:'Cancelado'};
const priorities={LOW:'Baja',MEDIUM:'Media',HIGH:'Alta',URGENT:'Urgente'};
let current=null,tickets=[],counter=4;
let filters={q:'',status:'',area:'',mine:false};
function fixtures(){counter=4;tickets=[
{id:'CW-0001',title:'Acceso a carpeta compartida',body:'Solicito acceso al repositorio compartido del equipo para preparar el informe interno.',area:'ti',requester:'marta',assignee:'diego',status:'OPEN',priority:'MEDIUM',due:'2026-10-16',comments:[],events:['Ticket creado por Marta.']},
{id:'CW-0002',title:'Revisión del equipo de trabajo',body:'El equipo presenta interrupciones al iniciar una sesión de trabajo.',area:'ti',requester:'luis',assignee:'diego',status:'IN_PROGRESS',priority:'HIGH',due:null,comments:[{author:'Luis',body:'La revisión puede hacerse en la jornada de soporte.'}],events:['Ticket creado por Luis.','Asignado a Diego.']},
{id:'CW-0003',title:'Ajuste de inventario',body:'Validar el registro de unidades y conciliar la diferencia del mes.',area:'op',requester:'ana',assignee:null,status:'RESOLVED',priority:'LOW',due:'2026-10-15',comments:[],events:['Ticket creado por Ana.','Estado cambiado a Resuelto.']},
{id:'CW-0004',title:'Confirmación de acceso anterior',body:'Registro de una solicitud ya finalizada para comparar los indicadores.',area:'ti',requester:'marta',assignee:'diego',status:'CLOSED',priority:'LOW',due:'2026-10-10',comments:[],events:['Ticket creado por Marta.','Cierre registrado por liderazgo.']}
];}
fixtures();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uname=id=>users.find(u=>u.id===id)?.name.split(' · ')[0]||'Sin asignar';
const canView=t=>current&&(current.admin||t.requester===current.id||t.assignee===current.id||current.members.includes(t.area)||current.leads.includes(t.area));
const canAssign=t=>current&&(current.admin||current.leads.includes(t.area));
const canClose=t=>current&&(current.admin||current.leads.includes(t.area));
const canAdvance=t=>current&&(canAssign(t)||t.assignee===current.id);
function toast(message){document.getElementById('toast').textContent=message;}
function go(route){if(location.hash.slice(1)===route){render();}else{location.hash=route;}}
function opts(obj,selected,blank){return (blank!==undefined?`<option value="">${esc(blank)}</option>`:'')+Object.entries(obj).map(([k,v])=>`<option value="${esc(k)}"${selected===k?' selected':''}>${esc(v)}</option>`).join('');}
function shell(content,route){return `<header><strong>CASTLEWALK TICKETS</strong><div class="persona"><label for="persona">Persona de demostración</label><select id="persona" onchange="switchPersona(this.value)">${users.map(u=>`<option value="${u.id}"${current.id===u.id?' selected':''}>${esc(u.name)}</option>`).join('')}</select></div></header><div class="layout"><nav aria-label="Navegación principal"><button class="${route==='home'?'active':''}" onclick="go('home')">Resumen</button><button class="${route==='tickets'?'active':''}" onclick="go('tickets')">Tickets</button><button class="${route==='new'?'active':''}" onclick="go('new')">Nuevo ticket</button><button onclick="resetData()">Reiniciar datos</button><button onclick="logout()">Salir</button></nav><main id="main">${content}</main></div>`;}
function switchPersona(id){current=users.find(u=>u.id===id);toast('Persona cambiada. Se aplican sus relaciones y permisos simulados.');render();}
function logout(){current=null;toast('Sesión de demostración terminada.');render();}
function login(e){e.preventDefault();current=users.find(u=>u.id===document.getElementById('login-persona').value);go('home');toast('Ingresaste a la demostración. No se verificó ninguna credencial.');}
function resetData(){fixtures();filters={q:'',status:'',area:'',mine:false};go('home');toast('Se restauraron los datos ficticios de inicio.');}
function rows(items){return `<div class="table-wrap"><table><thead><tr><th>Número y solicitud</th><th>Área</th><th>Estado</th><th>Prioridad</th></tr></thead><tbody>${items.map(t=>`<tr><td><button class="link" onclick="go('ticket/${t.id}')"><strong>${t.id}</strong> · ${esc(t.title)}</button><br><small>${esc(uname(t.assignee))}</small></td><td>${esc(areas[t.area])}</td><td><span class="pill ${t.status}">${statuses[t.status]}</span></td><td>${priorities[t.priority]}</td></tr>`).join('')}</tbody></table></div>`;}
function home(){let v=tickets.filter(canView),open=v.filter(t=>!['CLOSED','CANCELLED'].includes(t.status)),over=open.filter(t=>t.due&&t.due<'2026-10-17'),mine=v.filter(t=>t.requester===current.id||t.assignee===current.id);return `<div class="row spread"><div><h1>Panel de solicitudes</h1><p class="muted">Vista según la persona seleccionada. Fecha ficticia de referencia 17 de octubre de 2026.</p></div><button class="primary" onclick="go('new')">Nuevo ticket</button></div><div class="cards"><div class="card">Abiertos<b>${open.length}</b></div><div class="card">Vencidos<b>${over.length}</b></div><div class="card">Mis tickets<b>${mine.length}</b></div></div><p class="muted">Abiertos y vencidos excluyen Cerrado y Cancelado. Resuelto sigue contando como abierto. Mis tickets incluye solicitados y asignados de cualquier estado.</p><section class="panel"><h2>Solicitudes visibles</h2>${v.length?rows(v.slice().reverse()):'<div class="empty">No tienes relación con las solicitudes iniciales. Puedes crear una nueva.</div>'}</section>`;}
function list(){let v=tickets.filter(canView).filter(t=>(!filters.status||t.status===filters.status)&&(!filters.area||t.area===filters.area)&&(!filters.mine||t.requester===current.id||t.assignee===current.id)&&(`${t.id} ${t.title} ${t.body}`.toLowerCase().includes(filters.q.toLowerCase())));return `<div class="row spread"><h1>Tickets</h1><button class="primary" onclick="go('new')">Nuevo ticket</button></div><div class="filters"><label>Buscar<input id="search" value="${esc(filters.q)}" placeholder="Número o texto" oninput="searchTickets(this.value)"></label><label>Estado<select onchange="filters.status=this.value;render()">${opts(statuses,filters.status,'Todos')}</select></label><label>Área<select onchange="filters.area=this.value;render()">${opts(areas,filters.area,'Todas')}</select></label></div><div class="row spread"><label class="inline-check"><input type="checkbox"${filters.mine?' checked':''} onchange="filters.mine=this.checked;render()">Solo mis tickets</label><button onclick="filters={q:'',status:'',area:'',mine:false};render()">Limpiar filtros</button></div><p class="muted">${v.length} solicitud(es) visible(s). Sin paginación simulada.</p>${v.length?rows(v):'<div class="panel empty">No hay solicitudes que coincidan con tus filtros y permisos.</div>'}`;}
function searchTickets(q){filters.q=q;let pos=document.getElementById('search').selectionStart;render();let input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos);}
function newTicket(){return `<h1>Crear ticket</h1><p>Registra una solicitud para un área de atención.</p><form class="panel" id="new-form" onsubmit="createTicket(event)"><label for="title">Título de la solicitud</label><input id="title" name="title" required maxlength="200"><label for="area">Área de destino</label><select id="area" name="area" required>${opts(areas,'ti')}</select><label for="priority">Prioridad</label><select id="priority" name="priority">${opts(priorities,'LOW')}</select><p class="help">La web observada parte de Baja; la API usa Media si no recibe prioridad. Diferencia abierta FR-18.</p><label for="body">Descripción</label><textarea id="body" name="body" required></textarea><p class="muted">No se incluye vencimiento ni asignación inicial: el formulario web observado no presenta esos campos.</p><div class="row"><button class="primary" type="button" onclick="createTicket(event)">Crear ticket</button><button type="button" onclick="go('tickets')">Cancelar</button></div></form>`;}
function createTicket(e){e.preventDefault();const form=document.getElementById('new-form');if(!form.reportValidity())return;let f=new FormData(form),title=String(f.get('title')).trim(),body=String(f.get('body')).trim();if(!title||!body){toast('Completa título y descripción con contenido.');return;}let id='CW-'+String(++counter).padStart(4,'0');tickets.push({id,title,body,area:f.get('area'),priority:f.get('priority'),requester:current.id,assignee:null,status:'OPEN',due:null,comments:[],events:[`Ticket creado por ${uname(current.id)}.`]});go('ticket/'+id);toast('Ticket '+id+' creado solo en la demostración.');}
function detail(id){let t=tickets.find(x=>x.id===id);if(!t)return `<h1>Solicitud no encontrada</h1><button onclick="go('tickets')">Volver al listado</button>`;if(!canView(t))return `<h1>Acceso denegado</h1><div class="error">La persona seleccionada no puede consultar este ticket. El parentesco entre áreas no concede acceso.</div><button onclick="go('tickets')">Ver mis solicitudes</button>`;let allowed=Object.fromEntries(Object.entries(statuses).filter(([k])=>canClose(t)||!['CLOSED','CANCELLED'].includes(k)));return `<p><button class="link" onclick="go('tickets')">Volver a tickets</button></p><h1>${t.id} · ${esc(t.title)}</h1><p class="muted">Solicitado por ${esc(uname(t.requester))} · ${esc(areas[t.area])}</p><div class="ticket-grid"><div><section class="panel"><h2>Descripción</h2><p style="white-space:pre-wrap">${esc(t.body)}</p><p>Prioridad ${priorities[t.priority]} · Vencimiento ${t.due?esc(t.due):'sin definir'}</p></section><section class="panel"><h2>Comentarios</h2>${t.comments.map(c=>`<div class="comment"><small>${esc(c.author)} · Demostración</small><p>${esc(c.body)}</p></div>`).join('')||'<p class="muted">Sin comentarios.</p>'}<form onsubmit="addComment(event,'${t.id}')"><label for="comment">Agregar comentario</label><textarea id="comment" required></textarea><button class="primary" type="submit">Comentar</button></form></section></div><div><section class="panel"><h2>Gestión</h2><p>Estado actual <span class="pill ${t.status}">${statuses[t.status]}</span></p><label for="status">Cambiar estado</label><select id="status"${!canAdvance(t)&&!canClose(t)?' disabled':''}>${opts(allowed,t.status)}</select><button onclick="updateStatus('${t.id}')"${!canAdvance(t)&&!canClose(t)?' disabled':''}>Aplicar estado</button><p class="help" style="margin-top:12px">${canClose(t)?'Puedes cerrar y cancelar en esta área.':canAdvance(t)?'Puedes avanzar. Cerrar o cancelar requiere canClose.':'Tu relación permite consultar y comentar; no cambiar estado.'}</p><label for="assignee">Asignado</label><select id="assignee"${canAssign(t)?'':' disabled'}><option value="">Sin asignar</option>${users.map(u=>`<option value="${u.id}"${t.assignee===u.id?' selected':''}>${esc(uname(u.id))}</option>`).join('')}</select><button onclick="assign('${t.id}')"${canAssign(t)?'':' disabled'}>Guardar asignación</button><p class="muted">La base permite destinos ajenos al área; restringirlos es propuesta FR-15. La demostración no incluye administración.</p></section><section class="panel"><h2>Historial simulado</h2><ol class="timeline">${t.events.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section></div></div>`;}
function updateStatus(id){let t=tickets.find(t=>t.id===id),s=document.getElementById('status').value;if(!canView(t)||(['CLOSED','CANCELLED'].includes(s)?!canClose(t):!canAdvance(t))){toast('Sin permiso para cambiar a ese estado.');return;}if(t.status!==s){t.status=s;t.events.push('Estado cambiado a '+statuses[s]+' por '+uname(current.id)+'.');}render();toast('Estado actualizado en memoria. No hay grafo obligatorio de transiciones simulado.');}
function assign(id){let t=tickets.find(t=>t.id===id);if(!canView(t)||!canAssign(t)){toast('Sin permiso para asignar.');return;}t.assignee=document.getElementById('assignee').value||null;t.events.push('Asignado a '+uname(t.assignee)+' por '+uname(current.id)+'.');render();toast('Asignación guardada solo en memoria.');}
function addComment(e,id){e.preventDefault();let t=tickets.find(t=>t.id===id),body=document.getElementById('comment').value.trim();if(!canView(t)||!body){toast('Comentario vacío o sin permiso.');return;}t.comments.push({author:uname(current.id),body});t.events.push('Comentario de '+uname(current.id)+'.');render();toast('Comentario agregado a la demostración.');}
function render(){let app=document.getElementById('app');if(!current){app.innerHTML=`<section class="panel login"><h1>Acceso a la demostración</h1><p>Selecciona una persona ficticia para explorar solicitudes y permisos. No ingreses correo ni contraseña reales.</p><form onsubmit="login(event)"><label for="login-persona">Persona</label><select id="login-persona">${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><button class="primary" type="submit">Ingresar a la demostración</button></form><p class="muted" style="margin-top:20px">Simulación de acceso. La aplicación real valida credenciales y actividad de cuenta en API.</p></section>`;return;}let route=location.hash.slice(1)||'home',content=route==='home'?home():route==='tickets'?list():route==='new'?newTicket():route.startsWith('ticket/')?detail(route.slice(7)):'<h1>Página no encontrada</h1>';app.innerHTML=shell(content,route);}
window.addEventListener('hashchange',render);render();
</script></body></html>
